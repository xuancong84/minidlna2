# This is the configuration file for the microDLNA daemon, a DLNA/UPnP-AV media
# server.
#
# Unless otherwise noted, the commented out options show their default value.
#
# On Debian, you can also refer to the microdlna.conf(5) man page for
# documentation about this file.

# Specify the user name or uid to switch to after starting.
# Empty: keep running as the user that started microdlnad (root for the
# microdlna service, yourself when you run microdlnad directly).
# A command line -u option (e.g. from /etc/default/microdlna) overrides this.
user=


# Path to the directory you want scanned for media files.
#
# This option can be specified more than once if you want multiple directories
# scanned.
#
# If you want to restrict a media_dir to a specific content type, you can
# prepend the directory name with a letter representing the type (A, P or V),
# followed by a comma, as so:
#   * "A" for audio    (eg. media_dir=A,/var/lib/microdlna/music)
#   * "P" for pictures (eg. media_dir=P,/var/lib/microdlna/pictures)
#   * "V" for video    (eg. media_dir=V,/var/lib/microdlna/videos)
#   * "PV" for pictures and video (eg. media_dir=PV,/var/lib/microdlna/digital_camera)
#
# This file is only read when microdlnad is given it with -f, as the microdlna
# service does. Running microdlnad from a shell without -f reads no file: it
# uses built-in defaults and --option=value arguments, and serves the current
# directory as the current user.
media_dir=/var/lib/microdlna

# Set this to merge all media_dir base contents into the root container
# (The default is no.)
#merge_media_dirs=no

# Path to the directory that should hold the database and album art cache.
# If empty, no database is built and folders are listed from disk when a
# client browses them. That mode has no Artist/Album/Genre views, no search,
# no thumbnails, durations or DLNA profiles, and no bookmarks.
# To use a database instead: db_dir=/var/cache/microdlna
db_dir=

# Path to the directory that should hold the log file.
# Not used when "systemd" mode is activated with -S switch.
#log_dir=/var/log/microdlna

# Type and minimum level of importance of messages to be logged.
#
# The types are "artwork", "database", "general", "http", "inotify",
# "metadata", "scanner", "ssdp" and "tivo".
#
# The levels are "off", "fatal", "error", "warn", "info" or "debug".
# "off" turns of logging entirely, "fatal" is the highest level of importance
# and "debug" the lowest.
#
# The types are comma-separated, followed by an equal sign ("="), followed by a
# level that applies to the preceding types. This can be repeated, separating
# each of these constructs with a comma.
#
# The default is to log all types of messages at the "warn" level.
#log_level=general,artwork,database,inotify,scanner,metadata,http,ssdp,tivo=warn

# Use a different container as the root of the directory tree presented to
# clients. The possible values are:
#   * "." - standard container
#   * "B" - "Browse Directory"
#   * "M" - "Music"
#   * "P" - "Pictures"
#   * "V" - "Video"
#   * Or, you can specify the ObjectID of your desired root container
#     (eg. 1$F for Music/Playlists)
# If you specify "B" and the client device is audio-only then "Music/Folders"
# will be used as root.
# Ignored when db_dir is empty: the root is then always the folder tree.
root_container=B

# Network interface(s) to bind to (e.g. eth0), comma delimited.
# This option can be specified more than once.
#network_interface=

# Port number for HTTP traffic (descriptions, SOAP, media transfer).
# A port set here (or with -p/--port) is used exactly: microdlnad exits if it
# is busy. Without one, the first free port from 8200 upwards is used, and
# clients still find the server through discovery.
port=8200

# URL presented to clients (e.g. http://example.com:80).
#presentation_url=/

# Name that the DLNA server presents to clients.
# Defaults to "hostname: username".
#friendly_name=

# Serial number the server reports to clients.
# Defaults to the MAC address of nework interface.
#serial=

# Model name the server reports to clients.
#model_name=Windows Media Connect compatible (microDLNA)

# Model number the server reports to clients.
# Defaults to the version number of microdlna.
#model_number=

# Automatic discovery of new files in the media_dir directory.
# Ignored when db_dir is empty: folders are always read fresh.
inotify=yes

# List of file names to look for when searching for album art.
# Names should be delimited with a forward slash ("/").
# This option can be specified more than once.
album_art_names=Cover.jpg/cover.jpg/AlbumArtSmall.jpg/albumartsmall.jpg
album_art_names=AlbumArt.jpg/albumart.jpg/Album.jpg/album.jpg
album_art_names=Folder.jpg/folder.jpg/Thumb.jpg/thumb.jpg

# Strictly adhere to DLNA standards.
# This allows server-side downscaling of very large JPEG images, which may
# decrease JPEG serving performance on (at least) Sony DLNA products.
#strict_dlna=no

# Support for streaming .jpg and .mp3 files to a TiVo supporting HMO.
#enable_tivo=no

# Which method to use for registering in TiVo: 'bonjour' (default) or
# legacy 'beacon'
#tivo_discovery=bonjour

# SSDP notify interval, in seconds.
#notify_interval=895

# Path to the MiniSSDPd socket, for MiniSSDPd support.
#minissdpdsocket=/run/minissdpd.sock

# Always set SortCriteria to this value, regardless of the SortCriteria
# passed by the client
# e.g. force_sort_criteria=+upnp:class,+upnp:originalTrackNumber,+dc:title
#force_sort_criteria=

# Maximum number of simultaneous connections
# note: many clients open several simultaneous connections while streaming
#max_connections=50

# Set this to no to hide symlinks that point outside the media_dirs.
wide_links=yes

# Enable subtitle support by default on unknown clients.
#enable_subtitles=yes

# Generate video's thumbnails.
# To use this option, thumbnail generation must be enable at compile time.
# When db_dir is empty this defaults to yes: only played videos and videos in
# small folders get a thumbnail, made in the background and kept in memory.
#enable_thumbnail=no

# File extensions served as video, audio and pictures, matched
# case-insensitively and separated by '/' or ','. Setting one replaces its
# whole list; an empty value keeps the default shown here. Extensions without
# a built-in tag reader are probed with libavformat; pictures other than JPEG
# are served as they are (no resized versions).
#video_extensions=mpg/mpeg/avi/divx/xvid/asf/wmv/mp4/m4v/mts/m2ts/m2t/ts/vob/mkv/webm/flv/mov/3gp/rm/rmvb
#audio_extensions=mp3/flac/fla/flc/wma/asf/m4a/m4b/aac/mp4/m4p/wav/ogg/opus/mka/pcm/3gp/dsf/dff
#image_extensions=jpg/jpeg/png/webp

# When db_dir is empty: how names are transliterated for sorting folders
# (folders first, then a natural sort, so ep2 comes before ep10).
#   pinyin    Chinese by context-aware pinyin (重庆 chong qing, 银行 yin hang)
#             from pinyin_dict, everything else like unidecode (the default)
#   icu       ICU's transliterator; several times slower than pinyin, which
#             matters on slow CPUs such as a Raspberry Pi
#   unidecode the same order as Python natsorted(key=unidecode(t).lower())
#sort_transliteration=pinyin
#pinyin_dict=/usr/share/microdlna/pinyin-dict.txt.gz

# When db_dir is empty, folders with at most this many media files have them
# probed (duration, resolution, DLNA profile, tags) while the client waits;
# larger folders are not. Played files are always probed in the background.
# 0 = never probe while browsing.
#probe_limit=30

# When db_dir is empty, the longest a browse waits for probing, in
# milliseconds. Whatever isn't done by then is finished in the background and
# shows the next time the folder is opened. Bursts of browses (VLC opens every
# subfolder of a folder it shows) only get a tenth of the time, so they never
# stall the server for other requests.
#probe_time=500

# The width of the thumbnail image. Large images takes more time to generate.
#thumbnail_width=160

# Thumbnail Image quality.
#thumbnail_quality=8

# Should the thumbnail have a film strip?
#enable_thumbnail_filmstrip=no
