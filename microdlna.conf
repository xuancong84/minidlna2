# port for HTTP (descriptions, SOAP, media transfer) traffic
# a port set here is used exactly; without it, the first free port from 8200 up is used
port=8200

# network interfaces to serve, comma delimited (8 interfaces max)
#network_interface=eth0

# specify the user account name or uid to run as
# if empty, microdlna keeps running as the user that started it
user=

# set this to the directory you want scanned.
# * if you want multiple directories, you can have multiple media_dir= lines
# * if you want to restrict a media_dir to specific content types, you
#   can prepend the types, followed by a comma, to the directory:
#   + "A" for audio  (eg. media_dir=A,/home/jmaggard/Music)
#   + "V" for video  (eg. media_dir=V,/home/jmaggard/Videos)
#   + "P" for images (eg. media_dir=P,/home/jmaggard/Pictures)
#   + "PV" for pictures and video (eg. media_dir=PV,/home/jmaggard/digital_camera)
media_dir=/opt

# set this to merge all media_dir base contents into the root container
# note: the default is no
#merge_media_dirs=no

# set this if you want to customize the name that shows up on your clients
#friendly_name=My DLNA Server

# set this if you would like to specify the directory where you want microDLNA to store its database and album art cache
# if empty, no database is built: folders are listed from disk when a client browses them
# (no Artist/Album/Genre views, search, thumbnails, durations or bookmarks)
# e.g. db_dir=/var/cache/microdlna
db_dir=

# set this if you would like to specify the directory where you want microDLNA to store its log file
#log_dir=/var/log

# set this to change the verbosity of the information that is logged
# each section can use a different level: off, fatal, error, warn, info, or debug
#log_level=general,artwork,database,inotify,scanner,metadata,http,ssdp,tivo=warn

# this should be a list of file names to check for when searching for album art
# note: names should be delimited with a forward slash ("/")
album_art_names=Cover.jpg/cover.jpg/AlbumArtSmall.jpg/albumartsmall.jpg/AlbumArt.jpg/albumart.jpg/Album.jpg/album.jpg/Folder.jpg/folder.jpg/Thumb.jpg/thumb.jpg

# set this to no to disable inotify monitoring to automatically discover new files
# note: the default is yes; it has no effect when db_dir is empty
inotify=yes

# set this to yes to enable support for streaming .jpg and .mp3 files to a TiVo supporting HMO
enable_tivo=no

# set this to beacon to use legacy broadcast discovery method
# defauts to bonjour if avahi is available
tivo_discovery=bonjour

# set this to strictly adhere to DLNA standards.
# * This will allow server-side downscaling of very large JPEG images,
#   which may hurt JPEG serving performance on (at least) Sony DLNA products.
strict_dlna=no

# default presentation url is http address on port 80
#presentation_url=http://www.mylan/index.php

# notify interval in seconds. default is 895 seconds.
notify_interval=900

# serial and model number the daemon will report to clients
# in its XML description
serial=12345678
model_number=1

# specify the path to the MiniSSDPd socket
#minissdpdsocket=/var/run/minissdpd.sock

# use different container as root of the tree
# possible values:
#   + "." - use standard container (this is the default)
#   + "B" - "Browse Directory"
#   + "M" - "Music"
#   + "V" - "Video"
#   + "P" - "Pictures"
#   + Or, you can specify the ObjectID of your desired root container (eg. 1$F for Music/Playlists)
# if you specify "B" and client device is audio-only then "Music/Folders" will be used as root
# note: the default is "B"; it has no effect when db_dir is empty (the root is always the folder tree)
root_container=B

# always force SortCriteria to this value, regardless of the SortCriteria passed by the client
# note: you can prepend the sort criteria with "!" to alter the titles of the objects so that they
# will be alphanumerically sorted in the order you specify here, to work around clients that do their
# own alphanumeric sorting.
#force_sort_criteria=+upnp:class,+upnp:originalTrackNumber,+dc:title

# maximum number of simultaneous connections
# note: many clients open several simultaneous connections while streaming
#max_connections=50

# set this to no to hide symlinks that point outside user-defined media_dirs.
# note: the default is yes
wide_links=yes

# enable subtitle support by default on unknown clients.
# note: the default is yes
#enable_subtitles=yes

# Suport to Movie Thumbnail generation. To use this option, thumbnail generation must be enable at compile time.
# note: when db_dir is empty the default is yes (only played videos and videos in small folders get one)
#enable_thumbnail=no

# file extensions served as video, audio and pictures (case-insensitive, '/' or ',' separated);
# setting one replaces its whole list, an empty value keeps the default shown here
#video_extensions=mpg/mpeg/avi/divx/xvid/asf/wmv/mp4/m4v/mts/m2ts/m2t/ts/vob/mkv/webm/flv/mov/3gp/rm/rmvb
#audio_extensions=mp3/flac/fla/flc/wma/asf/m4a/m4b/aac/mp4/m4p/wav/ogg/opus/mka/pcm/3gp/dsf/dff
#image_extensions=jpg/jpeg/png/webp

# when db_dir is empty: how names are transliterated for sorting folders (folders first, then a natural
# sort: ep2 before ep10). pinyin: Chinese by context-aware pinyin from pinyin_dict (default, fastest);
# icu: ICU's transliterator (several times slower on slow CPUs); unidecode: like Python's unidecode()
#sort_transliteration=pinyin
#pinyin_dict=/usr/share/microdlna/pinyin-dict.txt.gz

# when db_dir is empty: folders with at most this many media files are probed (duration, resolution,
# DLNA profile, tags) while the client waits; larger folders are not. 0 = never probe while browsing
#probe_limit=30

# when db_dir is empty: the longest a browse waits for probing, in milliseconds; whatever is not
# done by then is finished in the background and shows on the next browse. Bursts of browses
# (e.g. VLC opening every subfolder) only get a tenth of the time, so they never stall the server
#probe_time=500

# The width of the thumbnail image. Large images takes more time to generate.  To use this option, thumbnail generation must be enable at compile time.
#thumbnail_width=160

# Thumbnail Image quality. To use this option, thumbnail generation must be enable at compile time.
#thumbnail_quality=8

# Should the thumbnail have a film strip? To use this option, thumbnail generation must be enable at compile time.
#enable_thumbnail_filmstrip=no
